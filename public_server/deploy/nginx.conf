# nginx site for the Public Server.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/smartschool-public
#   sudo ln -s /etc/nginx/sites-available/smartschool-public /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d maktab.example.tj        # fills in the TLS lines
#
# Replace maktab.example.tj with the real domain before using this.

server {
    listen 80;
    server_name maktab.example.tj;

    # certbot rewrites this to a redirect once a certificate exists. Until
    # then the site answers on plain HTTP -- fine for the first minutes of a
    # deployment, not for a school day: passwords and tokens are in the
    # clear until TLS is on.
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # uvicorn is started with --proxy-headers, so this is what tells it
        # the original request was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A pupil submitting a test on a poor connection, and Gemini-backed
        # calls from the school server, both outlast the 60s default.
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # Face photos are never synced here, but pupils' work is: keep the body
    # limit generous enough for a photo attachment and no more.
    client_max_body_size 12M;

    access_log /var/log/nginx/smartschool-public.access.log;
    error_log  /var/log/nginx/smartschool-public.error.log;
}
